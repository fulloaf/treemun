site_name: Treemün
site_description: Growth-and-yield simulation and harvest-scheduling optimization for plantation forests
site_url: https://treemun.readthedocs.io/
repo_url: https://github.com/fulloaf/treemun
repo_name: fulloaf/treemun
edit_uri: edit/main/docs/
copyright: Treemün is released under the MIT licence · © Felipe Ulloa-Fierro and contributors

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User guide:
      - Input data: guide/input-data.md
      - Simulation: guide/simulation.md
      - Economics: guide/economics.md
      - Carbon: guide/carbon.md
      - Optimization: guide/optimization.md
      - Multi-objective analysis: guide/multiobjective.md
      - Spatial planning: guide/spatial.md
      - GIS export: guide/gis-export.md
  - Reference:
      - API: reference/api.md
      - Growth models: reference/growth-models.md
      - Migration from 1.x: reference/migration.md
      - Changelog: reference/changelog.md
  - How to cite: citing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            heading_level: 3

exclude_docs: |
  images/
